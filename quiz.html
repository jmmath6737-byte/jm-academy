  .tab.on { background:#1d4ed8; color:#fff; border-color:#1d4ed8; }

  .qnum { font-size:11px; color:#888; margin-bottom:4px; }

  .btn.secondary { background:#fff; color:#1d4ed8; border:1.5px solid #1d4ed8; margin-top:8px; }
  .result { text-align:center; padding:18px 10px; }
  .score { font-size:40px; font-weight:800; color:#1d4ed8; }
  .score-sub { color:#777; font-size:13px; margin-top:2px; }

  .footer-note { font-size:11px; color:#999; text-align:center; margin-top:20px; line-height:1.6; }

function parseRetryParams() {
  const sp = new URLSearchParams(location.search);
  if (sp.get('mode') !== 'retry') return null;
  const year = parseInt(sp.get('year'), 10);
  const school = sp.get('school');
  const name = sp.get('name') || '';
  const q = (sp.get('q') || '').split(',').map(s => parseInt(s, 10)).filter(n => !isNaN(n));
  if (!year || !school || !q.length) return null;
  return { year, school, name, q };
}

function gradeSortIdx(g){ const i = GRADE_ORDER.indexOf(g); return i === -1 ? 999 : i; }

function fillNamesForGrade(nameId, grade) {
  const nameSel = document.getElementById(nameId);
  if (!grade) { nameSel.innerHTML = '<option value="">학년을 먼저 선택하세요</option>'; return; }
  const names = ROSTER.filter(s => s.grade === grade).map(s => s.name).sort();
  nameSel.innerHTML = '<option value="">이름 선택</option>' + names.map(n => `<option value="${n}">${n}</option>`).join('');
}
function setupGradeNameSelects(gradeId, nameId) {
  const gradeSel = document.getElementById(gradeId);
  const grades = [...new Set(ROSTER.map(s => s.grade))].sort((a, b) => gradeSortIdx(a) - gradeSortIdx(b));
  gradeSel.innerHTML = '<option value="">학년 선택</option>' + grades.map(g => `<option value="${g}">${g}</option>`).join('');
  gradeSel.addEventListener('change', () => fillNamesForGrade(nameId, gradeSel.value));
  fillNamesForGrade(nameId, '');
}

  try {
    if (!supabaseClient) throw new Error('no client');

    item.className = 'qitem';
    item.innerHTML = `<div class="qnum">${q}번</div><div class="choices" data-q="${q}">
      ${[1,2,3,4,5].map(c => `<div class="choice" data-c="${c}">${c}</div>`).join('')}
    </div>`;
    grid.appendChild(item);
  });
  grid.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => {
      const qEl = btn.parentElement;
      const q = qEl.dataset.q;
      qEl.querySelectorAll('.choice').forEach(b => b.classList.remove('sel'));
      btn.classList.add('sel');
      currentAnswers[q] = btn.dataset.c;
    });
  });
}
examSelect.addEventListener('change', renderGrid);

if (RETRY) {
  document.getElementById('pickerFields').classList.add('hidden');
  const banner = document.getElementById('retryBanner');
  banner.classList.remove('hidden');
  banner.textContent = `📌 ${RETRY.name}님 · ${RETRY.year}학년도 2학기 - ${RETRY.school} · 오답 ${RETRY.q.length}문항만 다시 풀어요`;
  const idx = currentExamIndex();
  if (idx >= 0) examSelect.value = idx;
}
renderGrid();

document.getElementById('submitBtn').addEventListener('click', async () => {
  const idx = currentExamIndex();
  const exam = EXAMS[idx];
  const qList = RETRY ? RETRY.q : Object.keys(exam.answers).map(Number);
  const total = qList.length;
  const answeredCount = Object.keys(currentAnswers).length;
  const name = RETRY ? RETRY.name : (document.getElementById('studentName').value || '').trim();
  if (!name) {
    alert('이름을 선택해야 채점할 수 있어요.');
    return;
  }
  if (answeredCount < total) {
    const msg = document.getElementById('unansweredMsg');
    if (!msg.dataset.confirmed) {
      msg.classList.remove('hidden');
      msg.dataset.confirmed = '1';
      return;
    }
  }

  let correct = 0;
  const rows = [];
  const wrongNums = [];
  qList.forEach(q => {
    const given = currentAnswers[q] || null;
    const ans = exam.answers[q];
    const isCorrect = given === ans;
    if (isCorrect) correct++; else wrongNums.push(q);
    rows.push({q, given, isCorrect});
  });
  document.getElementById('scoreBig').textContent = `${correct} / ${total}`;
  document.getElementById('scoreSub').textContent = `${name}님 · ${exam.year}학년도 2학기 - ${exam.school}` + (RETRY ? ' (오답 재시험)' : '');
  const wl = document.getElementById('wrongList');
  wl.innerHTML = rows.map(r => `
    <div class="wrongrow ${r.isCorrect ? 'ok' : ''}">
      <span>${r.q}번</span>
      <span>내 답: ${r.given ? circ[r.given-1] : '미응답'}</span>
      <span>${r.isCorrect ? '✅ 정답' : '❌ 오답'}</span>
    </div>`).join('');

  const wrongNoteBtn = document.getElementById('makeWrongNoteBtn');
  if (wrongNums.length) {
    wrongNoteBtn.classList.remove('hidden');
    wrongNoteBtn.onclick = () => generateAndDownloadWrongNote({
      exam_year: exam.year, exam_school: exam.school, student_name: name
    }, wrongNums);
  } else {
    wrongNoteBtn.classList.add('hidden');
  }

  setupCard.classList.add('hidden');
  resultCard.classList.remove('hidden');

  const statusEl = document.getElementById('saveStatus');
  statusEl.classList.remove('hidden', 'ok', 'fail');
  statusEl.classList.add('pending');
  statusEl.textContent = '선생님께 결과 저장 중...';

  try {
    if (!supabaseClient) throw new Error('no client');
    const { error } = await supabaseClient.from('quiz_submissions').insert({
      student_name: name,
      exam_year: exam.year,
      exam_school: exam.school,
      score: correct,
      total: total,
      answers: currentAnswers
    });
    if (error) throw error;
    statusEl.classList.remove('pending');
    statusEl.classList.add('ok');
    statusEl.textContent = '✅ 선생님께 결과가 저장되었습니다';

  } catch (e) {
    statusEl.classList.remove('pending');
    statusEl.classList.add('fail');
    statusEl.textContent = '⚠️ 저장에 실패했어요 (인터넷 연결을 확인해주세요). 점수는 위에 표시된 대로입니다.';
  }
});

document.getElementById('retryBtn').addEventListener('click', () => {
  resultCard.classList.add('hidden');
  setupCard.classList.remove('hidden');
  document.getElementById('unansweredMsg').classList.add('hidden');
  document.getElementById('unansweredMsg').dataset.confirmed = '';
  renderGrid();
});

document.getElementById('checkHistoryBtn').addEventListener('click', () => {
  const grade = document.getElementById('studentGrade').value;
  const name = document.getElementById('studentName').value || '';
  document.getElementById('historyGrade').value = grade;
  fillNamesForGrade('historyName', grade);
  document.getElementById('historyName').value = name;
  showHistoryTab();
  if (name) document.getElementById('historySearchBtn').click();
});

// ---------- 내 점수 확인 ----------
function fmtTime(ts) {
  const d = new Date(ts);
  return d.toLocaleString('ko-KR', {year:'numeric', month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
}

document.getElementById('historySearchBtn').addEventListener('click', async () => {
  const name = (document.getElementById('historyName').value || '').trim();
  const listEl = document.getElementById('historyList');
  if (!name) {
    listEl.innerHTML = '<div class="empty-msg">이름을 입력해주세요</div>';
    return;
  }
  listEl.innerHTML = '<div class="empty-msg">불러오는 중...</div>';
  try {
    const { data, error } = await supabaseClient
      .from('quiz_submissions')
      .select('*')
      .eq('student_name', name)
      .order('created_at', { ascending: false });
    if (error) throw error;
    if (!data || !data.length) {
      listEl.innerHTML = '<div class="empty-msg">채점 기록이 없어요. 이름을 정확히 입력했는지 확인해주세요.</div>';
      return;
    }
    listEl.innerHTML = data.map(r => `
      <div class="history-row">
        <div>
          <div class="hname">${r.exam_year}학년도 2학기 - ${r.exam_school}</div>
          <div class="htime">${fmtTime(r.created_at)}</div>
        </div>
        <div class="hscore">${r.score} / ${r.total}</div>
      </div>
    `).join('');
  } catch (e) {
    listEl.innerHTML = '<div class="empty-msg">불러오기에 실패했어요. 인터넷 연결을 확인해주세요.</div>';
  }
});
document.getElementById('historyName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('historySearchBtn').click();
});

// ---------- 오답노트 PDF (다시 틀린 문제만 모아서) ----------
function quizPdfLoadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('이미지 로드 실패: ' + url));
    img.src = url;
  });
}
function buildRetryQuizUrl(row, wrongNums) {
  const p = new URLSearchParams();
  p.set('mode', 'retry');
  p.set('year', row.exam_year);
  p.set('school', row.exam_school);
  p.set('name', row.student_name);
  p.set('q', wrongNums.join(','));
  return QUIZ_APP_BASE + '?' + p.toString();
}
function buildWrongNoteCoverCanvas(row, wrongNums) {
  const SCALE = 2.084;
  const W = Math.round(595 * SCALE), H = Math.round(841 * SCALE);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1d4ed8'; ctx.fillRect(0, 0, W, 230);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 26px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.fillText('JM 수학영어 · 리드인학원', 88, 80);
  ctx.font = 'bold 46px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.fillText('오답 노트', 88, 150);
  ctx.font = '24px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.fillText(row.exam_year + '학년도 2학기 중간고사 - ' + row.exam_school, 88, 195);

  const qrSize = 170;
  const qr = new QRious({ value: buildRetryQuizUrl(row, wrongNums), size: qrSize, background: '#ffffff', foreground: '#1d4ed8', level: 'M' });
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(W - 88 - qrSize - 16, 40, qrSize + 32, qrSize + 56);
  ctx.drawImage(qr.canvas, W - 88 - qrSize, 56, qrSize, qrSize);
  ctx.fillStyle = '#1d4ed8';
  ctx.font = 'bold 15px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('스캔하면 이 문제만 다시 풀 수 있어요', W - 88 - qrSize / 2, 56 + qrSize + 26);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#141414';
  ctx.font = 'bold 28px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.fillText('이름 : ' + row.student_name, 88, 300);

  ctx.fillStyle = '#dc2626';
  ctx.font = 'bold 27px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.fillText('📌 오늘 다시 풀어볼 문제 (총 ' + wrongNums.length + '개)', 88, 375);
  ctx.fillStyle = '#141414';
  ctx.font = 'bold 40px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  const chipText = wrongNums.map(n => n + '번');
  const maxW = W - 176;
  const lines = []; let cur = '';
  chipText.forEach(s => {
    const test = cur ? cur + '   ' + s : s;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = s; }
    else cur = test;
  });
  if (cur) lines.push(cur);
  let ly = 425;
  lines.forEach(l => { ctx.fillText(l, 88, ly); ly += 54; });

  ctx.fillStyle = '#6e6e6e';
  ctx.font = '20px "Malgun Gothic","Apple SD Gothic Neo",sans-serif';
  ctx.fillText('※ 아래 페이지에는 다른 문제도 함께 있어요. 표시된 번호만 다시 풀면 됩니다.', 88, ly + 30);
  ctx.fillText('※ QR을 찍으면 이 문제들만 바로 다시 풀고 채점할 수 있어요.', 88, ly + 56);
  return cv;
}
async function generateAndDownloadWrongNote(row, wrongNums) {
  const key = row.exam_year + '_' + row.exam_school;
  const qmap = QUIZ_PAGE_QMAP[key];
  if (!qmap) { alert('이 시험의 페이지 정보를 찾을 수 없어요'); return; }
  const wrongSet = {}; wrongNums.forEach(n => wrongSet[n] = true);
  const neededIdx = [];
  qmap.forEach((nums, i) => { if (nums.some(n => wrongSet[n])) neededIdx.push(i + 1); });

  const btn = document.getElementById('makeWrongNoteBtn');
  const origText = btn.textContent;
  btn.textContent = '만드는 중...'; btn.disabled = true;
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const W = doc.internal.pageSize.getWidth();
    const cover = buildWrongNoteCoverCanvas(row, wrongNums);
    const coverH = W * (cover.height / cover.width);
    doc.addImage(cover.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, W, coverH);
    for (const idx of neededIdx) {
      const slug = QUIZ_EXAM_SLUG[key] || key;
      const url = 'examimg/' + slug + '_p' + idx + '.jpg';
      const img = await quizPdfLoadImage(url);
      doc.addPage();
      const h = W * (img.height / img.width);
      doc.addImage(img, 'JPEG', 0, 0, W, h);
    }
    doc.save('오답노트_' + row.student_name + '_' + row.exam_year + row.exam_school + '.pdf');
  } catch (e) {
    alert('오답노트 생성에 실패했어요: ' + (e.message || e));
  } finally {
    btn.textContent = origText; btn.disabled = false;
  }
}
</script>
